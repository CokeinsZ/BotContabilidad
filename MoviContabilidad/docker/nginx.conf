# Versión web de MoviContabilidad: SPA exportada con `npx expo export -p web`.
# El TLS y el dominio los pone el proxy de la red pan-de-oro.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # JS y recursos llevan un hash en el nombre: no cambian nunca, caché de un año.
    location /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html, manifiesto e íconos se revisan en cada visita: una versión nueva
    # llega sin que haya que borrar la caché del teléfono.
    location / {
        add_header Cache-Control "no-cache";
        # SPA: /planillas, /trabajadores/... no son archivos; las resuelve la app.
        try_files $uri /index.html;
    }
}
