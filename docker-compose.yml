services:
  bot-contabilidad:
    build: .
    container_name: bot-contabilidad
    restart: unless-stopped
    ports:
      - 8000
    volumes:
      - /home/debian/secrets:/app/secrets
    environment:
      - EVOLUTION_API_BASE_URL=${EVOLUTION_API_BASE_URL}
      - EVOLUTION_API_INSTANCE_NAME=${EVOLUTION_API_INSTANCE_NAME}
      - EVOLUTION_API_TOKEN=${EVOLUTION_API_TOKEN}
      - WHISPER_URL=${WHISPER_URL}
      - DEEPSEEK_API_URL=${DEEPSEEK_API_URL}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - PLANILLA_TEMPLATE_ID=${PLANILLA_TEMPLATE_ID}
      - WORKERS_TEMPLATE_ID=${WORKERS_TEMPLATE_ID}
      - GOOGLE_OAUTH_REDIRECT_URI=${GOOGLE_OAUTH_REDIRECT_URI}
      - GOOGLE_ALLOWED_EMAILS=${GOOGLE_ALLOWED_EMAILS}
      - AUTH_ADMIN_USER=${AUTH_ADMIN_USER}
      - AUTH_ADMIN_PASSWORD=${AUTH_ADMIN_PASSWORD}
      - GOOGLE_CLIENT_SECRET_PATH=${GOOGLE_CLIENT_SECRET_PATH}
      - GOOGLE_TOKEN_PATH=${GOOGLE_TOKEN_PATH}
      - DATABASE_PATH=${DATABASE_PATH}
      - DATABASE_SCHEMA_PATH=${DATABASE_SCHEMA_PATH}
      - TIMEZONE=${TIMEZONE}
      - APP_JWT_SECRET=${APP_JWT_SECRET}
      - APP_ACCESS_TOKEN_MINUTES=${APP_ACCESS_TOKEN_MINUTES}
      - APP_REFRESH_TOKEN_DAYS=${APP_REFRESH_TOKEN_DAYS}
      - BOT_WHATSAPP_NUMBER=${BOT_WHATSAPP_NUMBER}
      - APP_PAIRINGS_PER_IP=${APP_PAIRINGS_PER_IP}
      - APP_WEB_ORIGINS=${APP_WEB_ORIGINS}
    networks:
      - pan-de-oro

  # Versión web de la app (la usan los iPhone). El proxy de pan-de-oro publica su
  # dominio apuntando a movicontabilidad-web:80, y ese dominio va en APP_WEB_ORIGINS
  # del bot (CORS). La URL del bot queda fija al construir: si cambia, reconstruir.
  movicontabilidad-web:
    build:
      context: ./MoviContabilidad
      args:
        EXPO_PUBLIC_API_URL: ${APP_WEB_API_URL:-https://contabilidad.notiasis.com}
    container_name: movicontabilidad-web
    restart: unless-stopped
    ports:
      - 80
    networks:
      - pan-de-oro

networks:
  pan-de-oro:
    external: true
